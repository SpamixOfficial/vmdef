[package]
name = "vmdef"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "vmdef"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0.102"
bytes = "1.11.1"
hex = "0.4.3"
pyo3 = { version = "0.28.3", features = ["anyhow"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_with = { version = "3.18.0", features = ["json"] }
