[package]
name = "vmdef"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "vmdef"
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0.102"
pyo3 = "0.28.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
